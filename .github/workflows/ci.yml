name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run per branch/PR; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, check, test
    # macOS: the Rust side links AppKit (SF Symbols) and the tests exercise it.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build frontend
        run: npm run build

      # Guards the `cfg(desktop)` gating; needs no Xcode project or signing.
      - name: Check the iOS target
        run: cargo check --target aarch64-apple-ios --manifest-path src-tauri/Cargo.toml
