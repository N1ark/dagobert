[package]
name = "dagobert"
version = "0.7.0"
description = "A DAG-shaped note-taking app"
authors = ["N1ark"]
edition = "2021"

[lib]
name = "dagobert_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
git2 = { version = "0.20", features = ["vendored-libgit2", "vendored-openssl", "ssh"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSData", "NSDictionary"] }
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSImageRep", "NSBitmapImageRep", "NSFontDescriptor", "objc2-core-foundation"] }
notify = "6"
notify-debouncer-mini = "0.4"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[lints.clippy]
all = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
